<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Normas - Busca FTS5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-box button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        .filter-group input {
            padding: 6px 10px;
            border: 1px solid #dee2e6;
            border-radius: 3px;
            width: 120px;
        }

        .stats {
            background: white;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-icon {
            font-size: 1.5em;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: 600;
            color: #667eea;
        }

        .results-section {
            padding: 30px;
            min-height: 300px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .result-item:hover {
            background: #fff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            border-left-color: #764ba2;
        }

        .result-norm {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .result-section {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .result-excerpt {
            background: white;
            padding: 15px;
            border-radius: 3px;
            margin-bottom: 10px;
            line-height: 1.6;
            color: #555;
            border-left: 3px solid #ffc107;
        }

        .result-excerpt mark {
            background: #ffc107;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-results-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .no-results-text {
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .no-results-hint {
            font-size: 0.95em;
            color: #bbb;
        }

        .result-count {
            background: #e7f3ff;
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #0066cc;
            font-weight: 600;
        }

        .error {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px 20px;
            border-radius: 5px;
            color: #856404;
            margin-bottom: 20px;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            text-align: center;
            color: #999;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .filters {
                flex-direction: column;
            }

            .filter-group {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Biblioteca de Normas</h1>
            <p>Busca Full-Text com normalização e contexto</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Digite o termo de busca (ex: postura, risco, EPI)..." autofocus>
                <button onclick="performSearch()">🔍 Buscar</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label for="contextBefore">Contexto Antes:</label>
                    <input type="number" id="contextBefore" value="200" min="50" max="500">
                </div>
                <div class="filter-group">
                    <label for="contextAfter">Contexto Depois:</label>
                    <input type="number" id="contextAfter" value="200" min="50" max="500">
                </div>
            </div>

            <div class="stats" id="stats"></div>
        </div>

        <div class="results-section" id="resultsContainer">
            <div class="no-results">
                <div class="no-results-icon">🔎</div>
                <div class="no-results-text">Nenhuma busca realizada</div>
                <div class="no-results-hint">Digite um termo acima e clique em Buscar</div>
            </div>
        </div>

        <div class="footer">
            <p>Biblioteca de Normas Regulamentadoras e ISO | Busca com FTS5 Normalizado</p>
        </div>
    </div>

    <script>
        // Função para permitir Enter na busca
        document.getElementById('searchInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        });

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('Digite um termo de busca');
                return;
            }

            const contextBefore = parseInt(document.getElementById('contextBefore').value);
            const contextAfter = parseInt(document.getElementById('contextAfter').value);

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Buscando...</p></div>';

            // Chamar busca via PyQt
            if (window.searchBridge) {
                window.searchBridge.search(query, contextBefore, contextAfter);
            }
        }

        function displayResults(results, query) {
            const resultsContainer = document.getElementById('resultsContainer');

            if (!results || results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">😞</div>
                        <div class="no-results-text">Nenhum resultado encontrado</div>
                        <div class="no-results-hint">Tente buscar por outros termos relacionados</div>
                    </div>
                `;
                return;
            }

            let html = `<div class="result-count">📊 ${results.length} resultado(s) encontrado(s) para "${query}"</div>`;

            results.forEach(result => {
                html += `
                    <div class="result-item">
                        <div class="result-norm">${result.norm_id}</div>
                        <div class="result-title">${result.norm_title}</div>
                        <div class="result-section">📄 ${result.section} | 📋 ${result.article}</div>
                        <div class="result-excerpt">${result.excerpt}</div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        function displayError(message) {
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = `<div class="error">❌ Erro: ${message}</div>`;
        }

        function updateStats(stats) {
            const statsContainer = document.getElementById('stats');
            statsContainer.innerHTML = `
                <div class="stat">
                    <div class="stat-icon">📚</div>
                    <div class="stat-info">
                        <div class="stat-label">Normas</div>
                        <div class="stat-value">${stats.total_norms}</div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon">📄</div>
                    <div class="stat-info">
                        <div class="stat-label">Artigos</div>
                        <div class="stat-value">${stats.total_articles}</div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon">📝</div>
                    <div class="stat-info">
                        <div class="stat-label">Palavras</div>
                        <div class="stat-value">${(stats.total_words / 1000).toFixed(1)}K</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
